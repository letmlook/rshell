# crates/rshell-core/Cargo.toml
[package]
name = "rshell-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RShell 后端层 - 终端、会话、传输、安全、脚本服务"

[dependencies]
rshell-api = { workspace = true }
rshell-protocol = { workspace = true }
rshell-infra = { workspace = true }
rshell-plugin-sdk = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
alacritty_terminal = "0.25"
rhai = "1"
regex = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "ecdsa", "encryption"] }
dirs = "5"

[dev-dependencies]
mockall = { workspace = true }
tokio-test = { workspace = true }
tempfile = { workspace = true }
