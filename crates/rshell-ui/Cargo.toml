# crates/rshell-ui/Cargo.toml
[package]
name = "rshell-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RShell 前端层 - GPUI 视图、ViewModel、应用入口"

[[bin]]
name = "rshell"
path = "src/main.rs"

[dependencies]
rshell-api = { workspace = true }
rshell-core = { workspace = true }
# rshell-core 仅在 main.rs / bridge 中使用，视图层仍只依赖 rshell-api
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
gpui = { version = "0.2", features = ["runtime_shaders"] }
gpui-component = "0.5"
dirs = "5"
arboard = "3"

[dev-dependencies]
mockall = { workspace = true }
