# crates/rshell-core/Cargo.toml
[package]
name = "rshell-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RShell 后端层 - 终端、会话、传输、安全、脚本服务"

[dependencies]
rshell-api = { workspace = true }
rshell-protocol = { workspace = true }
rshell-infra = { workspace = true }
rshell-plugin-sdk = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
rhai = { version = "1", features = ["sync"] }
regex = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "ecdsa", "encryption"] }
dirs = "5"
toml = "0.8"
# 2026-08-04 临时妥协:让 `terminal::channels` 模块能直接使用 tauri::ipc::Channel,
# SessionService 才能在 SSH recv 循环里 push 字节给前端 xterm。
# 重构方向:把 Channel 抽象成 trait,壳层提供实现。
tauri = { version = "2", default-features = false }

[dev-dependencies]
mockall = { workspace = true }
tokio-test = { workspace = true }
tempfile = { workspace = true }
static_assertions = { workspace = true }
serde_json = { workspace = true }
