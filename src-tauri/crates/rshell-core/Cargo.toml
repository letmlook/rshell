# crates/rshell-core/Cargo.toml
[package]
name = "rshell-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RShell 后端层 - 终端、会话、传输、安全、脚本服务"

[dependencies]
rshell-api = { workspace = true }
rshell-protocol = { workspace = true }
rshell-infra = { workspace = true }
rshell-plugin-sdk = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
rhai = { version = "1", features = ["sync"] }
regex = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
# ssh-key 0.7 依赖的 rand_core 0.10 删掉了 `OsRng`，系统熵源改由
# getrandom::SysRng 提供；`sys_rng` feature 才会暴露它与 rand_core 桥接。
getrandom = { version = "0.4", features = ["sys_rng"] }
# 必须与 rshell-protocol 同版本：ssh-key 的 PublicKey/PrivateKey 类型会跨 crate
# 传递，两套 0.6/0.7 会让密钥对象互不兼容。版本需满足 russh 的 =0.7.0-rc.11。
ssh-key = { version = "0.7.0-rc.11", features = ["ed25519", "rsa", "ecdsa", "encryption"] }
dirs = "5"
toml = "0.8"

[dev-dependencies]
mockall = { workspace = true }
tokio-test = { workspace = true }
tempfile = { workspace = true }
static_assertions = { workspace = true }
